<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gradWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#gradBg)" stroke="#1e293b" stroke-width="8"/>

  <!-- Waveform Rings & Synthesizer Bars -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Synth Soundwave Path -->
    <path d="M -180 0 Q -135 -140 -90 0 T 0 0 T 90 0 T 180 0" fill="none" stroke="url(#gradWave)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Pulse Dots -->
    <circle cx="-135" cy="-70" r="14" fill="#10b981"/>
    <circle cx="-45" cy="70" r="14" fill="#6366f1"/>
    <circle cx="45" cy="-70" r="14" fill="#818cf8"/>
    <circle cx="135" cy="70" r="14" fill="#ec4899"/>
  </g>
</svg>
